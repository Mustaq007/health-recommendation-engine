<div class="container">
    <h2>User Details</h2>
  
    <div class="form-group">
      <label>Name:</label>
      <input type="text" [(ngModel)]="user.name" placeholder="Enter your name">
    </div>
  
    <div class="form-group">
      <label>Date of Birth:</label>
      <input type="date" [(ngModel)]="user.dob" (change)="calculateAge()">
    </div>
  
    <div class="form-group">
      <label>Contact Number:</label>
      <input type="text" [(ngModel)]="user.contactNumber" placeholder="Enter your contact number">
    </div>
  
    <div class="form-group">
      <label>Address:</label>
      <input type="text" [(ngModel)]="user.address" placeholder="Enter your address">
    </div>
  
    <div class="form-group">
      <label>Gender:</label>
      <select [(ngModel)]="user.gender">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>
  
    <div class="form-group">
      <label>Email Address:</label>
      <input type="email" [(ngModel)]="user.emailAddress" placeholder="Enter your email">
    </div>

    <div class="form-group">
        <label>Password:</label>
        <input type="password" [(ngModel)]="user.password" placeholder="Enter password">
      </div>
  
    <div class="form-group">
      <label>Age:</label>
      <input type="number" readonly [(ngModel)]="user.age" placeholder="Enter your age">
    </div>
  
    <div class="form-group">
      <label>Medical History:</label>
      <textarea [(ngModel)]="user.medicalHistory" placeholder="Enter medical history"></textarea>
    </div>

    <div class="form-group">
        <label>Lifestyle Habit:</label>
        <textarea [(ngModel)]="user.lifeStyleHabit" placeholder="Enter Lifestyle Habit"></textarea>
      </div>
  
    <!-- <div class="form-group">
      <label>Risk Recommendation:</label>
      <textarea [(ngModel)]="user.riskRecommendation" placeholder="Enter risk recommendation"></textarea>
    </div>
  
    <div class="form-group">
      <label>Personalized Recommendation:</label>
      <textarea [(ngModel)]="user.personalizedRecommendation" placeholder="Enter personalized recommendation"></textarea>
    </div>
  
    <div class="form-group">
      <label>Doctor’s Recommendation:</label>
      <textarea [(ngModel)]="user.doctorsRecommendation" placeholder="Enter doctor's recommendation"></textarea>
    </div> -->
    <div class="button-wrapper">
      <button class="submit-btn" (click)="saveUser()">Submit</button>
      <button class="submit-btn" (click)="navigateToLogin()">Back</button>
    </div> 
    

    <p *ngIf="isSubmitted" class="success-message">User registered successfully!</p>
    <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
  
    <p *ngIf="isSubmitted" class="success-message">User data submitted successfully!</p>
  </div>
